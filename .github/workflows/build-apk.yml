name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Reuse the same debug signing key on every build so a new APK can be
      # installed over the previous one without uninstalling.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: blockscraft-debug-keystore-v1

      - name: Install dependencies
        run: npm ci

      - name: Build web files
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/android-setup.mjs
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BlocksCraft.apk

      - name: Upload APK (download from the Actions run page)
        uses: actions/upload-artifact@v4
        with:
          name: BlocksCraft-APK
          path: BlocksCraft.apk

      - name: Publish GitHub Release (only for version tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BlocksCraft.apk
          generate_release_notes: true

      # Rebuild the website so its download button serves the new APK.
      - name: Update website download
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK" > /dev/null && echo "Website redeploy triggered"; else echo "VERCEL_DEPLOY_HOOK not set; skipping"; fi
